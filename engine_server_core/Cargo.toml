[package]
name = "engine_server_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "engine_server_core"
path = "lib.rs"

[[bin]]
name = "engine_server_core"
path = "main.rs"

[dependencies]
axum = { version = "=0.8.9", features = ["multipart"] }
getrandom = "=0.4.3"
hmac = "=0.13.0"
quick-xml = "=0.37.2"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tower-http = { version = "=0.7.1", features = ["cors", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"
